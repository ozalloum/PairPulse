name: Clean installation and notebook validation
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  minimum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install 'numpy==1.24.0' 'scipy==1.10.0' 'matplotlib==3.7.0' .
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - run: python -m pip freeze
  reproduction:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-validation.txt .
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - run: python scripts/execute_notebook.py --output kernel-output
      - run: python -m pip freeze
      - uses: actions/upload-artifact@v4
        with:
          name: notebook-${{ matrix.os }}
          path: kernel-output/
